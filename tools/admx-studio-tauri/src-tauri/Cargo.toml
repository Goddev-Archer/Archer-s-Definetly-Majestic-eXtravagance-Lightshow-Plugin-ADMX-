[package]
name = "admx-studio-tauri"
version = "0.1.0"
description = "ADMX Studio – Next-Gen DMX Lightshow Designer & Multi-Pass Studio"
authors = ["Archer"]
edition = "2024"

[lib]
name = "admx_studio_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "pcm", "wav", "flac"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
crc32fast = "1.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
